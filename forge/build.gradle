plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()

            programArguments.addAll('mixin.env.remapRefMap', 'true'
                    , 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg")
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
   // annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly group: 'org.jetbrains',name:'annotations',version: '24.1.0'

    modImplementation "curse.maven:little-logistics-570050:4799459"
    //cooked
    //modImplementation("dev.murad.littlelogistics:littlelogistics:${ll_version}")
    //modCompileOnly("com.jozufozu.flywheel:${flywheel_version}")

    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    modRuntimeOnly("curse.maven:create-328085:6641603")


    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")

    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

}

jar {
    finalizedBy('reobfJar')
   // manifest.attributes([
   //         "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
   // ])
}
